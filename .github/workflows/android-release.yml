name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SafeNest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SafeNest-apk
          path: flutter_app/build/app/outputs/flutter-apk/SafeNest.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/SafeNest.apk
          body: |
            SafeNest Android build. Install the APK on an Android phone (allow "install unknown apps" when prompted).
            Requires location, notification, SMS and phone permissions for safe zones and SOS.
